##############################################################################
# Nginx configuration for ciphergate.techvaseegrah.com
# This proxies BOTH the REST API and Socket.IO WebSocket traffic
# to the Node backend on port 5001.
#
# DEPLOY: Copy this block into your Nginx sites file, e.g.
#   /etc/nginx/sites-available/ciphergate.techvaseegrah.com
# then: sudo nginx -t && sudo systemctl reload nginx
##############################################################################

# This map converts "Upgrade: websocket" HTTP header → "upgrade"
# and defaults to "" for regular HTTP requests.
# Without this, sending Connection: upgrade on polling breaks the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream for Node backend
upstream node_backend {
    server 127.0.0.1:5001;
    keepalive 64;
}

server {
    listen 80;
    server_name ciphergate.techvaseegrah.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ciphergate.techvaseegrah.com;

    # --- SSL certificates (update paths to match your certbot / Let's Encrypt location) ---
    ssl_certificate     /etc/letsencrypt/live/ciphergate.techvaseegrah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciphergate.techvaseegrah.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # -----------------------------------------------------------------------
    # CRITICAL: Socket.IO proxy with WebSocket upgrade
    # Socket.IO first connects via HTTP polling, then upgrades to WebSocket.
    # Both MUST be proxied correctly through this block.
    # -----------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass         http://node_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers — uses the map above so polling requests
        # don't incorrectly send Connection: upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long enough for Socket.IO pings (default pingInterval=25s)
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 60s;

        # Disable buffering — essential for real-time streaming
        proxy_buffering off;
        proxy_cache     off;
    }

    # -----------------------------------------------------------------------
    # REST API proxy
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://node_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;

        # Important for file uploads
        client_max_body_size 50m;
    }

    # -----------------------------------------------------------------------
    # Static file uploads served by Node (photos, documents, etc.)
    # Also handles POST /api/workers/upload-photo via the /api/ block above.
    # -----------------------------------------------------------------------
    location /uploads/ {
        proxy_pass         http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow images up to 10 MB
        client_max_body_size 10m;
    }

    # -----------------------------------------------------------------------
    # React frontend static files
    # Serve the built frontend (npm run build output)
    # -----------------------------------------------------------------------
    location / {
        root   /var/www/ciphergate.techvaseegrah.com/dist;   # <-- update this path
        index  index.html;
        try_files $uri $uri/ /index.html;   # React Router SPA fallback
    }
}
